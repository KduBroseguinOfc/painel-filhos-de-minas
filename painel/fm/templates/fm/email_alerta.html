<!doctype html><html lang="pt-BR"><body style="margin:0;background:#f8fafc;font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;color:#0f172a">
<div style="max-width:600px;margin:0 auto;padding:24px 16px">
  <div style="background:#1e40af;color:#fff;border-radius:8px 8px 0 0;padding:14px 18px"><div style="font-weight:700;font-size:16px">Painel Filhos de Minas</div><div style="font-size:13px;opacity:.9;margin-top:4px">{{ cabecalho }}</div></div>
  <div style="background:#fff;border:1px solid #e2e8f0;border-top:0;border-radius:0 0 8px 8px;padding:8px 18px 18px">
    {% for b in blocos %}
    <div style="border-left:4px solid #d4af37;background:#f8fafc;padding:10px 14px;margin:12px 0;border-radius:6px">
      <div style="font-weight:700;margin-bottom:6px">{{ b.titulo }}</div>
      <ul style="margin:0 0 8px;padding-left:18px;font-size:14px;line-height:1.5">{% for l in b.linhas %}<li>{{ l }}</li>{% endfor %}</ul>
      <a href="{{ b.link }}" style="display:inline-block;background:#1e40af;color:#fff;text-decoration:none;padding:8px 14px;border-radius:6px;font-size:13px;font-weight:600">{{ b.rotulo }}</a>
    </div>
    {% endfor %}
    <p style="color:#475569;font-size:12px;margin-top:18px">{{ rodape }}<br>Alterar ou desligar alertas: <a href="{{ url }}/alertas/" style="color:#1e40af">{{ url }}/alertas/</a></p>
  </div>
</div></body></html>
