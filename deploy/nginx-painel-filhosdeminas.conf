# /etc/nginx/sites-available/painel-filhosdeminas — HTTPS na rede interna, certificado autoassinado (gera-certificado.sh).
# O instalador troca __NOME_DNS__ e __IP_APP__. Proxy reverso na frente? Ele conversa com este servidor em https://__NOME_DNS__
# e envia X-Real-IP / X-Forwarded-For; informe o IP dele em PROXY_REVERSO_IP (o instalador escreve as linhas abaixo).
__REAL_IP__
server {
    listen 443 ssl http2;
    server_name __NOME_DNS__ __IP_APP__;

    ssl_certificate     /etc/painel-filhosdeminas/tls/painel.crt;
    ssl_certificate_key /etc/painel-filhosdeminas/tls/painel.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:painelfm:5m;

    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /static/ {
        alias /opt/painel-filhosdeminas/app/staticfiles/;
        expires 7d;
        access_log off;
    }
    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        # o token do SSO pode levar os grupos e ficar grande
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }
}
server {
    listen 80;
    server_name __NOME_DNS__ __IP_APP__;
    return 301 https://$host$request_uri;
}
